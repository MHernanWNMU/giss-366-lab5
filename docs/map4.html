    3.

/ schools ive attended in Las Vegas,and numeric attributes for each school/ 
<!DOCTYPE html>
<html>
<head>
    <title>My Map 4</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.10.0/dist/maplibre-gl.css" />
    <style>
        body { margin: 0; }
        #map { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script type="module">
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.10.0/dist/maplibre-gl.mjs';

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/positron',
            center: [-105.2239, 35.5939],   // [lng, lat]
            zoom: 13
        
        });
        map.addSource('schools',{
            type:'geojson',
            data:{
                'type': 'FeatureCollection',
                'features': [
                    {
                        type: 'Feature',
                        properties: {
                            name: 'New Horizons',
                            rating: 1
                        },
                        geometry: {
                            type: 'Point',
                            coordinates: [-105.21972, 35.5934]
                        }
                    },
                    {
                        type: 'Feature',
                        properties: {
                            name: 'Early Childhood Center',
                            rating: 2
                            },
                         geometry: {
                            type: 'Point',
                            coordinates: [-105.22122, 35.59788]
                         }
                     },
                     {
                        type: 'Feature',
                        properties: {
                            name: 'Legion Park Elementary School',
                            rating: 3
                            },
                         geometry: {
                            type: 'Point',
                            coordinates: [-105.22982, 35.61674]
                         }
                     },
                     {
                        type: 'Feature',
                        properties: {
                            name: 'Memorial Middle School',
                            rating: 4
                            },
                         geometry: {
                            type: 'Point',
                            coordinates: [-105.23437, 35.61558]
                         }
                     },
                     {
                        type: 'Feature',
                        properties: {
                            name: 'RobertsonHigh School',
                            rating: 5
                            },
                         geometry: {
                            type: 'Point',
                            coordinates: [-105.21886, 35.60299]
                         }
                     }
                ]
            }
        });
        map.addLayer({
            id: 'schools',
            type: 'circle',
            source: 'schools',
            paint: {
                'circle-radius': 8,
                'circle-color': '#4c34dc',
                'circle-stroke-color': '#a28ff7',
                'circle-stroke-width': 2
            }
        });
        window.map = map;
    </script>
</body>
</html>
